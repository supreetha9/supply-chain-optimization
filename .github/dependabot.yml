version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      ml:
        patterns:
          - "prophet"
          - "mlflow*"
          - "ortools"
          - "scipy"
          - "scikit-learn"
      dbt:
        patterns:
          - "dbt-*"
      streamlit:
        patterns:
          - "streamlit"
          - "plotly"
      dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
