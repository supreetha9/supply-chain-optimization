name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs of the same workflow on a branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + dbt-independent tests + dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip wheel setuptools

      - name: Install project (dev + dbt + streamlit; skip docs for speed)
        # Prophet is heavy (compiles cmdstanpy); install separately so the
        # rest of the deps cache cleanly even if Prophet's build changes.
        run: |
          pip install -e ".[dev,dbt,streamlit]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run dbt-independent tests
        run: |
          pytest tests/test_metrics.py tests/test_safety_stock.py tests/test_vendor_scoring.py -v

      - name: dbt deps
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
        run: dbt deps

      - name: dbt parse (validates project syntax without DuckDB)
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
        run: dbt parse
