# =============================================================================
# Airflow 2.10 + Postgres metadata DB on LocalExecutor, plus a dedicated
# MLflow tracking server.
#
# The host project root is mounted to /opt/airflow/repo so DAG tasks can
# `cd dbt_project && dbt build` and `python -m python.src.forecast` from
# inside the scheduler container.
#
# The Airflow image is built from ./airflow/Dockerfile so dbt + prophet +
# mlflow + ortools are all on PATH (no _PIP_ADDITIONAL_REQUIREMENTS hack).
#
# MLflow tracks experiments at http://mlflow:5000 (in-network) and
# http://localhost:5000 (host). data/mlruns/ is mounted as the artifact
# root; mlflow.db (sqlite) lives in the same volume.
# =============================================================================

x-airflow-common: &airflow-common
  build: ./airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - .:/opt/airflow/repo
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >-
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////mlruns/mlflow.db
        --default-artifact-root /mlruns
    ports:
      - "5000:5000"
    volumes:
      - ./data/mlruns:/mlruns
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_USERNAME:-admin}" \
          --password "${AIRFLOW_PASSWORD:-admin}" \
          --firstname "${AIRFLOW_FIRSTNAME:-Supply}" \
          --lastname  "${AIRFLOW_LASTNAME:-Admin}" \
          --role Admin \
          --email "${AIRFLOW_EMAIL:-supply@example.com}"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

volumes:
  postgres-db-volume:
